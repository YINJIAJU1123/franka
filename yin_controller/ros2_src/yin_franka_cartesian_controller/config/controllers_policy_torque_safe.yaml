/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 98

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

      franka_policy_torque_controller:
        type: yin_franka_cartesian_controller/FrankaPolicyTorqueController

/**:
  joint_state_broadcaster:
    ros__parameters:
      update_rate: 60

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      update_rate: 60
      lock_try_count: 5
      lock_sleep_interval: 5
      lock_log_error: false
      lock_update_success: true

/**:
  franka_policy_torque_controller:
    ros__parameters:
      arm_id: "fr3"
      command_topic: "~/policy_action"
      action_timeout: 0.20
      # Match cpos_n JointControlError._lmda in the training implementation.
      dls_lambda: 0.01
      # Match training's panda_tool reference point.  The real hand_tcp has
      # the same link7-local Z offset: 0.107 + 0.1034 = 0.2104 m.
      tool_offset_from_joint7: [0.0, 0.0, 0.2104]
      add_coriolis: true
      coriolis_update_decimation: 4
      debug_publish_period: 0.25
      dq_filter_alpha: 0.35

      max_pos_delta: 0.06
      max_ori_delta: 0.10
      max_pos_delta_norm: 0.08
      max_ori_delta_norm: 0.14

      min_kd_multiplier: 0.05
      max_kd_multiplier: 2.0
      min_kp: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
      max_kp: [200.0, 200.0, 200.0, 200.0, 160.0, 160.0, 160.0]

      lower_joint_limits: [-2.7437, -1.7837, -2.9007, -3.0421, -2.8065, 0.5445, -3.0159]
      upper_joint_limits: [2.7437, 1.7837, 2.9007, -0.1518, 2.8065, 4.5169, 3.0159]
      max_delta_q: [0.08, 0.08, 0.08, 0.08, 0.10, 0.10, 0.10]
      max_torque: [14.0, 14.0, 14.0, 14.0, 10.0, 10.0, 10.0]
      max_torque_rate: [60.0, 60.0, 60.0, 60.0, 45.0, 45.0, 45.0]
      timeout_damping: [4.0, 4.0, 4.0, 4.0, 3.0, 3.0, 3.0]
